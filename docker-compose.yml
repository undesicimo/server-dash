services:
  server-dash:
    build: .
    container_name: server-dash
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      STORAGE_PATH: "/host/media/josh/MediaStorage"
      APP_NAME: "${APP_NAME:-Server Dash}"
      HOMER_CONFIG_URL: "${HOMER_CONFIG_URL:-}"
      HOMER_CONFIG_PATH: "${HOMER_CONFIG_PATH:-/host/home/josh/media-stack/homepage_config/config.yml}"
      APP_CHECK_BASE: "${APP_CHECK_BASE:-}"
      PUBLIC_LAN_HOST: "${PUBLIC_LAN_HOST:-}"
      PUBLIC_TAILSCALE_HOST: "${PUBLIC_TAILSCALE_HOST:-}"
      WORKOUT_APP_URL: "${WORKOUT_APP_URL:-http://192.168.1.9:3002}"
      HERMES_STATUS_PATH: "${HERMES_STATUS_PATH:-/host/home/josh/.hermes/gateway_state.json}"
    volumes:
      - /:/host:ro
      - server_dash_envs:/app/data
    restart: unless-stopped

volumes:
  server_dash_envs:
